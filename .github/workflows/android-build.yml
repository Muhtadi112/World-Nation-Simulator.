name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --verbose --export-debug "Android" build/android/WorldNationSimulator.apk
          test -s build/android/WorldNationSimulator.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Nation-Simulator-Android
          path: build/android/WorldNationSimulator.apk
          if-no-files-found: error
          retention-days: 14
